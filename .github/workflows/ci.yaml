name: CI - Lint & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint Manifests & Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Lint Python Locust Scenario
        run: |
          flake8 load-testing/locustfile.py --max-line-length=120 --ignore=E501,W503

      - name: Validate Kubernetes Manifests
        run: |
          python scripts/validate.py
