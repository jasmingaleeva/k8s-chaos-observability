apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile-config
  namespace: boutique
data:
  locustfile.py: |
    import random
    from locust import HttpUser, task, between

    PRODUCT_IDS = [
        "OLJCESPC7Z", "66VCHSJNUP", "1YMWWN1N4O", "L9ECAV7KIM",
        "2ZYFJ3GM2N", "0PUK6TGMSL", "LS4PSXUNUM"
    ]

    class BoutiqueCustomerUser(HttpUser):
        wait_time = between(0.5, 2)

        @task(4)
        def browse_homepage(self):
            self.client.get("/", name="GET / (Homepage)")

        @task(5)
        def view_product(self):
            product_id = random.choice(PRODUCT_IDS)
            self.client.get(f"/product/{product_id}", name="GET /product/[id]")

        @task(3)
        def add_to_cart(self):
            product_id = random.choice(PRODUCT_IDS)
            self.client.post(
                "/cart",
                data={"product_id": product_id, "quantity": random.randint(1, 3)},
                name="POST /cart (Add to Cart)"
            )

        @task(2)
        def view_cart(self):
            self.client.get("/cart", name="GET /cart")

        @task(1)
        def checkout(self):
            self.client.post(
                "/cart/checkout",
                data={
                    "email": "devops-tester@tbank.ru",
                    "street_address": "2-ya Khutorskaya ul., 38A",
                    "zip_code": "127287",
                    "city": "Moscow",
                    "state": "Moscow",
                    "country": "Russia",
                    "credit_card_number": "4111111111111111",
                    "credit_card_expiration_month": "12",
                    "credit_card_cvv": "123",
                },
                name="POST /cart/checkout"
            )
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-load-test
  namespace: boutique
spec:
  ttlSecondsAfterFinished: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.32.8
          command: ["locust"]
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
            - "--headless"
            - "-u"
            - "15"
            - "-r"
            - "3"
            - "--run-time"
            - "3m"
            - "--host"
            - "http://frontend:80"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: locustfile-volume
              mountPath: /mnt/locust
      volumes:
        - name: locustfile-volume
          configMap:
            name: locustfile-config
