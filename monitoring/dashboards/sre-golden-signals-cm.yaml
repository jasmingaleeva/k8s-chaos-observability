apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sre-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sre-golden-signals.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "🎯 SRE Golden Signal: Traffic",
          "type": "row"
        },
        {
          "title": "Network Traffic (Inbound KB/s) per Microservice",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "KBs"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"boutique\"}[1m])) by (pod) / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Network Traffic (Outbound KB/s) per Microservice",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "KBs"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"boutique\"}[1m])) by (pod) / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "id": 101,
          "title": "⚠️ SRE Golden Signal: Errors & Availability",
          "type": "row"
        },
        {
          "title": "Pod Restarts (Spikes during Chaos / CrashLoop)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 9 },
          "id": 3,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 80 },
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"boutique\"}[2m])) by (pod)",
              "legendFormat": "{{pod}} (restarts)"
            }
          ]
        },
        {
          "title": "Unready Pod Count (System Health Degraded)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 9 },
          "id": 4,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"boutique\", phase!=\"Running\"}) or vector(0)",
              "legendFormat": "Non-running Pods"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "id": 102,
          "title": "📈 SRE Golden Signal: Saturation (CPU & Memory)",
          "type": "row"
        },
        {
          "title": "CPU Usage (Cores) per Pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 17 },
          "id": 5,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "none"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"boutique\", container!=\"\"}[1m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Memory Working Set (MB) per Pod",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 17 },
          "id": 6,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "decmbytes"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"boutique\", container!=\"\"}) by (pod) / (1024 * 1024)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 103,
          "title": "📜 Centralized Logs: Loki Live Stream",
          "type": "row"
        },
        {
          "title": "Real-time Container Logs (Namespace: boutique)",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 25 },
          "id": 7,
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{namespace=\"boutique\"}",
              "legendFormat": ""
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["sre", "golden-signals", "chaos", "observability"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Microservices SRE Golden Signals & Logs",
      "uid": "sre-golden-signals"
    }
